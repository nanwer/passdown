# Development candidate: use init.sh --build until release images are published.
name: passdown
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '5' }
x-passdown: &passdown
  image: ${PASSDOWN_IMAGE:-ghcr.io/nanwer/passdown:0.1.0-alpha.1}
x-operator-environment: &operator-environment
  GUIDE_OWNER_DATABASE_URL: postgresql://guide_owner:${GUIDE_DB_OWNER_PASSWORD:?Run init.sh}@postgres:5432/guide_app
  GUIDE_DATABASE_URL: postgresql://guide_runtime:${GUIDE_DB_RUNTIME_PASSWORD:?Run init.sh}@postgres:5432/guide_app
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Run init.sh}
  GUIDE_MEDIA_ROOT: /var/lib/passdown/media
services:
  postgres:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    restart: unless-stopped
    environment:
      POSTGRES_DB: guide_app
      POSTGRES_USER: guide_owner
      POSTGRES_PASSWORD: ${GUIDE_DB_OWNER_PASSWORD:?Run init.sh}
    volumes: [database:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guide_owner -d guide_app']
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
    logging: *logging
  migrate:
    <<: *passdown
    entrypoint: ['passdown']
    command: ['migrate']
    restart: 'no'
    environment: *operator-environment
    networks: [backend]
    depends_on: { postgres: { condition: service_healthy } }
    logging: *logging
  web:
    <<: *passdown
    restart: unless-stopped
    init: true
    environment:
      GUIDE_DATABASE_URL: postgresql://guide_runtime:${GUIDE_DB_RUNTIME_PASSWORD:?Run init.sh}@postgres:5432/guide_app
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run init.sh}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Run init.sh}
      PASSDOWN_SETUP_CODE_SHA256: ${PASSDOWN_SETUP_CODE_SHA256:-}
    volumes: [media:/var/lib/passdown/media]
    networks: [backend, frontend]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging: *logging
  proxy:
    image: ${PASSDOWN_PROXY_IMAGE:-ghcr.io/nanwer/passdown-caddy:0.1.0-alpha.1}
    restart: unless-stopped
    environment:
      PASSDOWN_DOMAIN: ${PASSDOWN_DOMAIN:?Run init.sh}
      PASSDOWN_TLS: ${PASSDOWN_TLS:?Run init.sh}
      PASSDOWN_HSTS_MAX_AGE: ${PASSDOWN_HSTS_MAX_AGE:-31536000}
      PASSDOWN_SIGN_IN_LIMIT: ${PASSDOWN_SIGN_IN_LIMIT:-30}
      PASSDOWN_LINK_LIMIT: ${PASSDOWN_LINK_LIMIT:-30}
      PASSDOWN_ADMIN_LIMIT: ${PASSDOWN_ADMIN_LIMIT:-60}
    ports: ['${PASSDOWN_HTTP_PORT:-80}:80', '${PASSDOWN_HTTPS_PORT:-443}:443']
    volumes: [proxy-data:/data, proxy-config:/config]
    networks: [frontend]
    depends_on: { web: { condition: service_started } }
    logging: *logging
  ops:
    <<: *passdown
    profiles: ['ops']
    entrypoint: ['passdown']
    command: ['help']
    environment: *operator-environment
    volumes: [media:/var/lib/passdown/media]
    networks: [backend]
    depends_on: { postgres: { condition: service_healthy } }
    logging: *logging
networks:
  backend: { internal: true }
  frontend: {}
volumes: { database: {}, media: {}, proxy-data: {}, proxy-config: {} }

# Build Passdown from this checkout instead of pulling published images.
# From the deploy folder:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
# PASSDOWN_BUILD_TAG (default "local") names the images, so several checkouts
# can keep their builds apart. Nothing is published to a registry.
x-build: &build
  context: ..
  dockerfile: Dockerfile
  args:
    PASSDOWN_REVISION: ${PASSDOWN_REVISION:-unknown}
    PASSDOWN_VERSION: ${PASSDOWN_VERSION:-0.1.0-alpha.1}
services:
  web: { image: 'passdown:${PASSDOWN_BUILD_TAG:-local}', build: *build }
  init: { image: 'passdown:${PASSDOWN_BUILD_TAG:-local}', pull_policy: never }
  migrate: { image: 'passdown:${PASSDOWN_BUILD_TAG:-local}', pull_policy: never }
  ops: { image: 'passdown:${PASSDOWN_BUILD_TAG:-local}', pull_policy: never }
  proxy:
    image: 'passdown-caddy:${PASSDOWN_BUILD_TAG:-local}'
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
      args:
        PASSDOWN_REVISION: ${PASSDOWN_REVISION:-unknown}
        PASSDOWN_VERSION: ${PASSDOWN_VERSION:-0.1.0-alpha.1}

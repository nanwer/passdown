name: Passdown checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Check the commit explanation
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: node scripts/check-commit-message.mjs --event
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm local:setup
      - run: pnpm test:database
      - if: always()
        run: |
          if [ -f .env.local ]; then
            docker compose --env-file .env.local -f compose.app.yaml down
          fi

  fixtures:
    name: Fixtures (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            command: pnpm test:e2e
          - engine: firefox
            command: pnpm test:cross-browser --project=firefox
          - engine: webkit
            command: pnpm test:cross-browser --project=webkit
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - run: ${{ matrix.command }}

  authoring:
    name: Authoring (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - run: pnpm local:setup
      - run: pnpm test:authoring --project=${{ matrix.engine }}
      - if: always()
        run: |
          if [ -f .env.local ]; then
            docker compose --env-file .env.local -f compose.app.yaml down
          fi
